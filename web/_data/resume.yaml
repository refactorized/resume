# Durable voice / tone assets (from the archive plaintext résumé). Rarely printed,
# but valuable for keeping tailored copy in Adam's own register.
voice:
  # First-person "About", verbatim from LinkedIn — Adam's own register, for tailoring copy.
  about: >-
    With 15+ years in web applications development, I am a full-stack polyglot with an
    affinity for javascript and front-end work. I have experience across several major
    platforms, most recently node stacks running in fully open source toolchains.


    I am driven by a love for my craft and the desire to write conscientious code that
    emphasizes ease of maintenance, reuse, composability and testability. I try to learn as
    much as possible and I am happiest when solving problems that demand intelligence,
    creativity, and a knack for functional decomposition. I also enjoy instructing and
    mentoring in software development, and have done so professionally.
  intro: >-
    Seasoned software engineer with experience across a broad variety of platforms and
    paradigms; provided technical leadership and innovation as architect of multiple
    full-stack web solutions. A career spanning nearly two decades — from CGI gateways to
    SPAs to JAM-stack — through every swing of the pendulum between client and server,
    UX and DX, semantic and presentational CSS.
  character:
    - Has loved programming since 7th grade — learned BASIC from a math textbook on an IBM 8088
    - Has loved JavaScript since 2012, after sitting down with "JavaScript, The Good Parts"
    - Believes effective programming is discovering the boundary between innate and artificial complexity
    - Believes empathy, humility, and curiosity are as essential as knowledge, intelligence, and experience
    - Values diversity, equity, inclusivity, and accessibility
    - Vastly prefers solving difficult problems to completing repetitive tasks
    - Really likes bulleted lists (and parentheses)
    - Once coded a computed-tomography simulation overnight from a purely algorithmic description of the math — a polyglot's knack for unfamiliar domains and languages
